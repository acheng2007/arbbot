name: arbbot
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arbbot
      POSTGRES_PASSWORD: arbbot
      POSTGRES_DB: arbbot
    ports:
      - "127.0.0.1:${ARBBOT_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbbot -d arbbot"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      ARBBOT_DATABASE_URL: postgresql+psycopg://arbbot:arbbot@db:5432/arbbot
      ARBBOT_MODE: ${ARBBOT_MODE:-simulation}
      ARBBOT_REVIEW_SOURCE: ${ARBBOT_REVIEW_SOURCE:-database}
      ARBBOT_DISCOVERY_MODE: ${ARBBOT_DISCOVERY_MODE:-broad}
      ARBBOT_DISCOVERY_LIMIT: ${ARBBOT_DISCOVERY_LIMIT:-50}
      ARBBOT_CATALOG_REFRESH_SECONDS: ${ARBBOT_CATALOG_REFRESH_SECONDS:-300}
      ARBBOT_CATALOG_MAX_AGE_SECONDS: ${ARBBOT_CATALOG_MAX_AGE_SECONDS:-900}
      ARBBOT_DISCOVERY_SCAN_PAGES: ${ARBBOT_DISCOVERY_SCAN_PAGES:-8}
      ARBBOT_DISCOVERY_FAMILIES:
      ARBBOT_KALSHI_TICKERS: ${ARBBOT_KALSHI_TICKERS:-[]}
      ARBBOT_POLYMARKET_MARKET_IDS: ${ARBBOT_POLYMARKET_MARKET_IDS:-[]}
      ARBBOT_ENABLED_VENUES: ${ARBBOT_ENABLED_VENUES:-["kalshi","polymarket_us"]}
      ARBBOT_POLYMARKET_US_MARKET_IDS: ${ARBBOT_POLYMARKET_US_MARKET_IDS:-[]}
      ARBBOT_POLYMARKET_WEBSOCKET: ${ARBBOT_POLYMARKET_WEBSOCKET:-true}
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    command: ["uvicorn", "arbbot.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend_environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    command: ["arbbot-worker"]
    environment: *backend_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 60s
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    environment:
      BACKEND_URL: http://api:8000
      ARBBOT_WEB_DATA_SOURCE: backend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
volumes:
  postgres_data:
