[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arbbot-backend"
version = "0.1.0"
description = "Prediction-market discovery and conservative arbitrage evaluation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.53.0", "pydantic==2.13.5",
  "pydantic-settings==2.15.0", "sqlalchemy[asyncio]==2.0.54",
  "psycopg[binary]==3.3.6", "alembic==1.20.0", "httpx==0.28.1",
  "cryptography==50.0.1", "prometheus-client==0.26.0",
  "websockets==17.1",
  "PyJWT==2.14.0",
  "pypdf==6.20.0",
  "fastembed==0.9.0",
  "opentelemetry-sdk==1.44.0", "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "aiosqlite==0.22.1", "ruff==0.16.8"]

[project.scripts]
arbbot-worker = "arbbot.workers.main:main"

[tool.setuptools.packages.find]
include = ["arbbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
