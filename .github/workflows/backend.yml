name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arbbot
          POSTGRES_PASSWORD: arbbot
          POSTGRES_DB: arbbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbbot -d arbbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARBBOT_DATABASE_URL: postgresql+psycopg://arbbot:arbbot@localhost:5432/arbbot
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m pip install --no-deps -e backend
      - name: Lint and formatting
        run: |
          ruff check backend
          ruff format --check backend
      - name: SQLite tests
        run: pytest -q backend/tests
      - name: PostgreSQL tests
        env:
          ARBBOT_TEST_DATABASE_URL: postgresql+psycopg://arbbot:arbbot@localhost:5432/arbbot
        run: pytest -q backend/tests
      - name: Migrate and check schema
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check
      - name: Recorded contract coverage
        run: >-
          python -m arbbot.matching.corpus report
          --records backend/tests/fixtures/contracts/recorded.json
          --labels backend/tests/fixtures/contracts/labels.json
      - name: Verify published API contracts
        run: |
          python -m arbbot.api.export_schema --output docs/openapi.json
          python -m arbbot.api.export_schema --reviews --output docs/reviews.schema.json
          python -m arbbot.api.export_schema --definitions --output docs/definitions.schema.json
          python -m arbbot.api.export_schema --execution --output docs/execution.schema.json
          git diff --exit-code -- docs/openapi.json docs/reviews.schema.json docs/definitions.schema.json docs/execution.schema.json
